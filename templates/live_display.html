{% extends 'base.html' %}
{% block title %}Live Display{% endblock %}
{% block extra_styles %}
  #display{font-size:2.5rem;white-space:pre-wrap;margin-top:2rem;}
{% endblock %}
{% block content %}
<h1 class="title">Live Display</h1>
<div id="display"></div>
{% endblock %}
{% block extra_scripts %}
<script>
const disp=document.getElementById('display');
async function fetchText(){
  const r=await fetch('{{ url_for('live_data', session_id=session.id) }}');
  if(r.ok){const d=await r.json();disp.textContent=d.text||'';}
}
setInterval(fetchText,1000);
fetchText();
</script>
{% endblock %}
