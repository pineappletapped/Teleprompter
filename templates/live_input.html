{% extends 'base.html' %}
{% block title %}Live Input{% endblock %}
{% block content %}
<h1 class="title">Live Session Input</h1>
<p>Share this link with the display device:</p>
<input class="input" type="text" readonly value="{{ url_for('live_display', session_id=session.id, _external=True) }}">
<textarea id="liveText" class="textarea" rows="10">{{ session.text }}</textarea>
{% endblock %}
{% block extra_scripts %}
<script>
const ta = document.getElementById('liveText');
let timer = null;
function send(){
  fetch('{{ url_for('live_input', session_id=session.id) }}', {
    method: 'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'text='+encodeURIComponent(ta.value)
  });
}
ta.addEventListener('input', ()=>{clearTimeout(timer);timer=setTimeout(send,300);});
</script>
{% endblock %}
