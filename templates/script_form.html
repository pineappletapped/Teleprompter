{% extends 'base.html' %}
{% block title %}New Script{% endblock %}
{% block content %}
<h1 class="title">New Script</h1>
<form method="post">
  <div class="field">
    <label class="label">Title</label>
    <div class="control"><input class="input" name="title" required></div>
  </div>
  <div class="field">
    <label class="label">Body</label>
    <div class="control"><textarea class="textarea" name="body" rows="8" required></textarea></div>
  </div>
  <div class="field">
    <div class="control"><button class="button is-primary" type="submit">Save</button></div>
  </div>
</form>
{% endblock %}
