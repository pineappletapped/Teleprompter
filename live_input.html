<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Input</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script src="app.js"></script>
</head>
<body class="section" onload="initLiveInput()">
  <div class="container">
    <h1 class="title">Live Session Input</h1>
    <p>Share this link with the display device:</p>
    <input class="input" id="shareLink" type="text" readonly>
    <textarea id="liveText" class="textarea" rows="10"></textarea>
  </div>
</body>
</html>
